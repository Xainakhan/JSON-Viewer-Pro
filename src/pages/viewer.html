<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>JSON Viewer Pro</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <main class="viewer-shell">
      <header class="viewer-header">
        <p class="eyebrow">JSON Viewer Pro</p>
        <h1>Explore JSON clearly.</h1>
        <p class="intro">Paste JSON below to format and inspect it.</p>
      </header>

      <section class="viewer-toolbar" role="toolbar" aria-label="Viewer controls">
        <label for="path-format">Copy paths as</label>
        <select id="path-format" name="path-format">
          <option value="dot">Dot path</option>
          <option value="jsonPath">JSONPath</option>
          <option value="optionalChaining">Optional chaining</option>
        </select>
        <button id="expand-all-button" type="button" disabled>Expand all</button>
        <button id="collapse-all-button" type="button" disabled>Collapse all</button>
        <span class="view-mode-controls" aria-label="View mode">
          <button id="tree-view-button" type="button" aria-pressed="true">Tree</button>
          <button id="raw-view-button" type="button" aria-pressed="false">Raw</button>
        </span>
        <button id="theme-toggle-button" type="button">Switch to dark theme</button>
      </section>

      <section class="viewer-toolbar" role="toolbar" aria-label="Search">
        <label for="search-input">Search</label>
        <input
          id="search-input"
          name="search-input"
          type="search"
          placeholder="Search keys and values"
          autocomplete="off"
        />
        <span id="search-status" class="search-status" role="status"></span>
      </section>

      <section class="input-panel" aria-labelledby="input-heading">
        <div class="section-heading">
          <h2 id="input-heading">JSON input</h2>
          <button id="format-button" class="primary-button" type="button">Format</button>
        </div>
        <label class="sr-only" for="json-input">Paste JSON</label>
        <textarea
          id="json-input"
          name="json-input"
          placeholder='Paste JSON here, for example: { "name": "Ada" }'
          spellcheck="false"
        ></textarea>
      </section>

      <section class="output-panel" aria-labelledby="output-heading">
        <div class="section-heading">
          <h2 id="output-heading">Output</h2>
        </div>
        <div id="json-output" class="output-area" aria-live="polite" role="status">
          <div id="tree-output"></div>
          <pre id="raw-output" class="raw-output" hidden></pre>
          <pre id="error-output" class="error-output" hidden></pre>
        </div>
      </section>
      <div id="copy-toast" class="copy-toast" aria-live="polite" role="status"></div>
    </main>

    <script type="module" src="viewer.js"></script>
  </body>
</html>
